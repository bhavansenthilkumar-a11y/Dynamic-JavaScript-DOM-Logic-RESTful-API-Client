
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Product Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Dynamic Product Store</h1>
        <p>Find your favourite products</p>

        <button id="cartToggle" class="cart-toggle">
            🛒 Cart (<span id="cartCount">0</span>)
        </button>
    </header>

    <main>
        <section class="controls">
            <input
                type="text"
                id="searchInput"
                placeholder="Search products..."
                aria-label="Search products"
            >

            <div id="categoryTabs">
                <button class="category-btn active" data-category="all">
                    All
                </button>
            </div>

            <select id="sortSelect" aria-label="Sort products">
                <option value="default">Sort By</option>
                <option value="low-high">Price: Low to High</option>
                <option value="high-low">Price: High to Low</option>
            </select>
        </section>

        <!-- Loading skeleton cards -->
        <section
            id="loading"
            class="product-grid"
            aria-label="Loading products"
            hidden
        >
            <div class="skeleton-card">
                <div class="skeleton-image"></div>
                <div class="skeleton-line"></div>
                <div class="skeleton-line short"></div>
                <div class="skeleton-line price-line"></div>
            </div>

            <div class="skeleton-card">
                <div class="skeleton-image"></div>
                <div class="skeleton-line"></div>
                <div class="skeleton-line short"></div>
                <div class="skeleton-line price-line"></div>
            </div>

            <div class="skeleton-card">
                <div class="skeleton-image"></div>
                <div class="skeleton-line"></div>
                <div class="skeleton-line short"></div>
                <div class="skeleton-line price-line"></div>
            </div>

            <div class="skeleton-card">
                <div class="skeleton-image"></div>
                <div class="skeleton-line"></div>
                <div class="skeleton-line short"></div>
                <div class="skeleton-line price-line"></div>
            </div>
        </section>

        <!-- Error message and retry button -->
        <div id="errorBanner" hidden role="alert">
            Unable to load products. Please try again.
            <button id="retryBtn">Retry</button>
        </div>

        <!-- Empty search result message -->
        <p id="emptyMessage" hidden>No products found.</p>

        <!-- Products rendered by JavaScript -->
        <section
            id="productList"
            class="product-grid"
            aria-label="Products"
        ></section>
    </main>

    <!-- Cart background overlay -->
    <div id="cartOverlay" class="cart-overlay" hidden></div>

    <!-- Slide-out shopping cart -->
    <aside
        id="cartPanel"
        class="cart-panel"
        aria-label="Shopping cart"
        aria-hidden="true"
        inert
    >
        <div class="cart-header">
            <h2>Your Cart</h2>

            <button
                id="closeCart"
                aria-label="Close cart"
            >
                ✕
            </button>
        </div>

        <!-- Cart products appear here -->
        <div id="cartItems"></div>

        <div class="cart-footer">
            <h3>
                Total: $<span id="cartTotal">0.00</span>
            </h3>

            <button id="clearCart">Clear Cart</button>
        </div>
    </aside>

    <script type="module" src="js/app.js"></script>

</body>
</html>
